<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="NHworks - Learn Today. Build Tomorrow." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="20" fill="url(#bg)"/>
  <circle cx="820" cy="40" r="60" fill="#10b981" opacity="0.12">
    <animate attributeName="r" values="60;75;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="170" r="45" fill="#059669" opacity="0.10">
    <animate attributeName="r" values="45;58;45" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#0f172a">NH<tspan fill="url(#g)">works</tspan></text>
  <text x="450" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#047857">Learn Today. Build Tomorrow.
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.45;1" dur="3s" fill="freeze"/>
  </text>
  <rect x="330" y="160" width="240" height="4" rx="2" fill="url(#g)">
    <animate attributeName="width" values="0;240" dur="2s" fill="freeze"/>
  </rect>
</svg>
